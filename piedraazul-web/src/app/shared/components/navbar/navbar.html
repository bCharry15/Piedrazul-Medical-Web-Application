<header class="navbar">
  <div class="navbar-content">

    <!-- MARCA -->

    <button
      type="button"
      class="brand"
      (click)="goHome()"
      [attr.aria-label]="text(
        'Ir al inicio de PiedraAzul',
        'Go to PiedraAzul home'
      )"
    >
      <img
        src="/assets/piedra_azul__.png"
        alt="Piedra Azul Clínica"
        class="brand-logo"
      />

      <div class="brand-copy">
        <strong>
          PiedraAzul
        </strong>

        <span>
          {{
            text(
              'Gestión clínica y agendamiento médico',
              'Clinical management and medical scheduling'
            )
          }}
        </span>
      </div>
    </button>


    <!-- NAVEGACIÓN PÚBLICA -->

    <nav
      class="main-navigation"
      *ngIf="!isAuthenticated"
      [attr.aria-label]="text(
        'Navegación principal',
        'Main navigation'
      )"
    >
      <button
        type="button"
        (click)="goHome()"
      >
        <span>
          {{
            text(
              'Inicio',
              'Home'
            )
          }}
        </span>
      </button>

      <button
        type="button"
        (click)="goToSection('servicios')"
      >
        <span>
          {{
            text(
              'Servicios',
              'Services'
            )
          }}
        </span>
      </button>

      <button
        type="button"
        (click)="goToSection('como-funciona')"
      >
        <span>
          {{
            text(
              'Cómo funciona',
              'How it works'
            )
          }}
        </span>
      </button>

      <button
        type="button"
        (click)="goToSection('nosotros')"
      >
        <span>
          {{
            text(
              'Nosotros',
              'About us'
            )
          }}
        </span>
      </button>

      <button
        type="button"
        (click)="goToSection('contacto')"
      >
        <span>
          {{
            text(
              'Contacto',
              'Contact'
            )
          }}
        </span>
      </button>
    </nav>


    <!-- ACCIONES -->

    <div class="navbar-actions">

      <!-- IDIOMA -->

      <div
        class="language-selector"
        role="group"
        [attr.aria-label]="text(
          'Seleccionar idioma',
          'Select language'
        )"
      >
        <button
          type="button"
          class="language-button"
          [class.active]="i18n.language() === 'es'"
          [attr.aria-pressed]="i18n.language() === 'es'"
          (click)="setLanguage('es')"
        >
          ES
        </button>

        <span
          class="language-divider"
          aria-hidden="true"
        ></span>

        <button
          type="button"
          class="language-button"
          [class.active]="i18n.language() === 'en'"
          [attr.aria-pressed]="i18n.language() === 'en'"
          (click)="setLanguage('en')"
        >
          EN
        </button>
      </div>


      <!-- NO AUTENTICADO -->

      <div
        class="guest-actions"
        *ngIf="!isAuthenticated"
      >
        <button
          type="button"
          class="login-button"
          (click)="login()"
        >
          <span>
            {{
              text(
                'Iniciar sesión',
                'Sign in'
              )
            }}
          </span>

          <span
            class="button-arrow"
            aria-hidden="true"
          >
            →
          </span>
        </button>
      </div>


      <!-- AUTENTICADO -->

      <div
        class="authenticated-actions"
        *ngIf="isAuthenticated"
      >
        <span class="user-pill">
          <span
            class="user-dot"
            aria-hidden="true"
          ></span>

          <span class="user-name">
            {{ username }}
          </span>
        </span>

        <button
          type="button"
          class="portal-button"
          (click)="goToPortal()"
        >
          <span>
            {{
              text(
                'Mi portal',
                'My portal'
              )
            }}
          </span>

          <span
            class="button-arrow"
            aria-hidden="true"
          >
            →
          </span>
        </button>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          {{
            text(
              'Salir',
              'Sign out'
            )
          }}
        </button>
      </div>

    </div>

  </div>
</header>
