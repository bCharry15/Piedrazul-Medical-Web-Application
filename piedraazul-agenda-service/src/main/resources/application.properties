spring.application.name=piedraazul-agenda-service
server.port=8081

# BASE DE DATOS - MARIADB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3307/piedraazul_agenda}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:piedraazul}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:piedraazul}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# SWAGGER / OPENAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# EMAIL NOTIFICATIONS
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notification.mail.enabled=${NOTIFICATION_MAIL_ENABLED:false}
notification.mail.from=${NOTIFICATION_MAIL_FROM:no-reply@piedraazul.com}

# KEYCLOAK / JWT
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8085/realms/PiedrAzul/protocol/openid-connect/certs}

keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8085/realms/PiedrAzul/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:agenda-service}

keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8085}
keycloak.realm=${KEYCLOAK_REALM:PiedrAzul}
keycloak.admin-token-uri=${KEYCLOAK_ADMIN_TOKEN_URI:http://localhost:8085/realms/master/protocol/openid-connect/token}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}

server.error.include-message=always
server.error.include-binding-errors=always

# ADMIN MONITORING (same /api proxy used locally and in Azure)
management.endpoints.web.base-path=/api/monitoring
management.endpoints.web.exposure.include=health,metrics,logfile
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
# SMTP is optional; its availability must not mark the agenda as unavailable.
management.health.mail.enabled=false

# Rolling logs survive container replacement through the agenda_logs volume.
logging.file.name=${LOG_FILE:logs/piedraazul-agenda.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.level=%5p [requestId=%X{requestId:-none}]
