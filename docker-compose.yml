services:
  mariadb-agenda:
    image: mariadb:11.4
    container_name: piedraazul-mariadb-agenda
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: piedraazul_agenda
      MARIADB_USER: piedraazul
      MARIADB_PASSWORD: piedraazul

    ports:
      - "3307:3306"

    volumes:
      - mariadb_agenda_data:/var/lib/mysql

    networks:
      - piedraazul-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -uroot -p$${MARIADB_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: piedraazul-keycloak
    command: start-dev --import-realm
    restart: unless-stopped

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"

    ports:
      - "8085:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/piedrazul-realm.json:/opt/keycloak/data/import/piedrazul-realm.json
      - ./keycloak/themes:/opt/keycloak/themes

    networks:
      - piedraazul-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s


  agenda-service:
    build:
      context: ./piedraazul-agenda-service
      dockerfile: Dockerfile

    container_name: piedraazul-agenda-service
    restart: unless-stopped

    depends_on:
      mariadb-agenda:
        condition: service_healthy

      keycloak:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb-agenda:3306/piedraazul_agenda
      SPRING_DATASOURCE_USERNAME: piedraazul
      SPRING_DATASOURCE_PASSWORD: piedraazul

      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/PiedrAzul/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/PiedrAzul/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: agenda-service

      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: PiedrAzul

      KEYCLOAK_ADMIN_TOKEN_URI: http://keycloak:8080/realms/master/protocol/openid-connect/token
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      NOTIFICATION_MAIL_ENABLED: "false"
      NOTIFICATION_MAIL_FROM: no-reply@piedraazul.com

      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""

    ports:
      - "8081:8081"

    networks:
      - piedraazul-network


volumes:
  mariadb_agenda_data:
  keycloak_data:


networks:
  piedraazul-network:
    driver: bridge